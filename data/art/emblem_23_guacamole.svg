<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Guac-a-mole: a mole popping out of an avocado half, hammer raised.
       The traps pop and hide like the mole; the pit is the hammer's target. -->
  <!-- Avocado half (skin + flesh) -->
  <ellipse cx="256" cy="270" rx="180" ry="220" fill="#3E5A2E" stroke="#120B26" stroke-width="14"/>
  <ellipse cx="256" cy="270" rx="146" ry="186" fill="#8BC34A"/>
  <ellipse cx="256" cy="270" rx="146" ry="186" fill="none" stroke="#6B8E3A" stroke-width="8"/>
  <!-- Stone socket where the mole pops out -->
  <ellipse cx="256" cy="330" rx="86" ry="60" fill="#7BA03F" stroke="#6B8E3A" stroke-width="8"/>
  <!-- The mole -->
  <g>
    <!-- body -->
    <ellipse cx="256" cy="320" rx="72" ry="88" fill="#6B4A35" stroke="#120B26" stroke-width="12"/>
    <!-- belly -->
    <ellipse cx="256" cy="342" rx="42" ry="52" fill="#C89B6D"/>
    <!-- snout -->
    <ellipse cx="256" cy="316" rx="22" ry="16" fill="#E8A87C" stroke="#120B26" stroke-width="8"/>
    <circle cx="256" cy="310" r="6" fill="#120B26"/>
    <!-- whiskers -->
    <g stroke="#120B26" stroke-width="5" stroke-linecap="round">
      <line x1="236" y1="318" x2="196" y2="308"/>
      <line x1="236" y1="326" x2="198" y2="328"/>
      <line x1="276" y1="318" x2="316" y2="308"/>
      <line x1="276" y1="326" x2="314" y2="328"/>
    </g>
    <!-- eyes: one squinting, one wide -->
    <circle cx="228" cy="284" r="11" fill="#120B26"/>
    <circle cx="284" cy="284" r="11" fill="#120B26"/>
    <circle cx="231" cy="281" r="4" fill="#FFF3DC"/>
    <circle cx="287" cy="281" r="4" fill="#FFF3DC"/>
    <!-- paws gripping the hammer haft -->
    <circle cx="256" cy="252" r="17" fill="#6B4A35" stroke="#120B26" stroke-width="9"/>
    <!-- hammer: haft up-right, head at the top -->
    <g transform="rotate(24 256 252)">
      <rect x="248" y="96" width="18" height="160" rx="9" fill="#C89B6D" stroke="#120B26" stroke-width="9"/>
      <rect x="196" y="64" width="122" height="58" rx="14" fill="#B0BEC5" stroke="#120B26" stroke-width="11"/>
      <rect x="196" y="78" width="122" height="12" fill="#8D9AA3"/>
    </g>
    <!-- hard hat: the fairground worker mole -->
    <path d="M212,258 Q256,196 300,258 Z" fill="#FFB300" stroke="#120B26" stroke-width="11" stroke-linejoin="round"/>
    <rect x="204" y="252" width="104" height="18" rx="9" fill="#FFB300" stroke="#120B26" stroke-width="9"/>
  </g>
  <!-- Motion sparks: the mole just popped -->
  <g stroke="#FFF3DC" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="220" x2="128" y2="204"/>
    <line x1="362" y1="220" x2="384" y2="204"/>
    <line x1="256" y1="176" x2="256" y2="152"/>
  </g>
</svg>
