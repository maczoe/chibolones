<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- La Escalera: a wooden ladder leaning into the dusk sky, one rung per
       goal — 30, 60, 90, 120. Land each rung exactly, in order, top to
       bottom of the climb. -->
  <rect x="48" y="48" width="416" height="416" rx="48" fill="#2B4A7A" stroke="#161225" stroke-width="14"/>
  <!-- Dusk sky rings -->
  <circle cx="256" cy="264" r="176" fill="none" stroke="#3A5E96" stroke-width="10" opacity="0.7"/>
  <circle cx="256" cy="264" r="132" fill="none" stroke="#3A5E96" stroke-width="8" opacity="0.5"/>
  <!-- Setting sun -->
  <circle cx="256" cy="120" r="42" fill="#F2C14E" stroke="#161225" stroke-width="9"/>
  <!-- Ladder rails (leaning) -->
  <g transform="rotate(6 256 280)">
    <rect x="178" y="140" width="34" height="300" rx="10" fill="#C98A4B" stroke="#161225" stroke-width="10"/>
    <rect x="300" y="140" width="34" height="300" rx="10" fill="#C98A4B" stroke="#161225" stroke-width="10"/>
    <!-- Rungs, one per goal, bottom (30) to top (120) -->
    <rect x="196" y="368" width="120" height="26" rx="8" fill="#E8A85C" stroke="#161225" stroke-width="8"/>
    <rect x="196" y="298" width="120" height="26" rx="8" fill="#E8A85C" stroke="#161225" stroke-width="8"/>
    <rect x="196" y="228" width="120" height="26" rx="8" fill="#E8A85C" stroke="#161225" stroke-width="8"/>
    <rect x="196" y="158" width="120" height="26" rx="8" fill="#E8A85C" stroke="#161225" stroke-width="8"/>
  </g>
  <!-- Goal tallies beside the rungs -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#F2C14E" stroke="#161225" stroke-width="3">
    <text x="112" y="392" font-size="44">30</text>
    <text x="112" y="322" font-size="44">60</text>
    <text x="112" y="252" font-size="44">90</text>
    <text x="104" y="182" font-size="44">120</text>
  </g>
  <!-- A marble about to land the top rung -->
  <circle cx="392" cy="150" r="22" fill="#FFF9EE" stroke="#161225" stroke-width="8"/>
  <circle cx="386" cy="143" r="7" fill="#FFFFFF"/>
</svg>
